<!DOCTYPE html>
<html lang="en">
<head>
    <title>Weather App</title>
</head>
<body>
    <h2>Weather App</h2>
    <input type="text" id="cityInput" placeholder="Enter city">
    <button onclick="getWeather()">Get Weather</button>
    <div id="weatherResult"></div>

    <script>
      async function getWeather() {
    let city = document.getElementById("cityInput").value;
    let weatherResult = document.getElementById("weatherResult");

    if (city.trim() === "") {
        weatherResult.innerHTML = `<p style="color:red;">Please enter a city name!</p>`;
        return;
    }

    weatherResult.innerHTML = `<p>Loading...</p>`;

    try {
        let response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=YOUR_API_KEY&units=metric`);

        if (response.status === 401) {
            throw new Error("Invalid API Key! Please check your OpenWeather API key.");
        } else if (response.status === 404) {
            throw new Error("City not found! Please enter a valid city.");
        } else if (!response.ok) {
            throw new Error(`Error: ${response.status}`);
        }

        let data = await response.json();

        weatherResult.innerHTML = `
            <h3>${data.name}</h3>
            <p>🌡 Temperature: ${data.main.temp}°C</p>
            <p>💧 Humidity: ${data.main.humidity}%</p>
            <p>🌪 Weather: ${data.weather[0].description}</p>
        `;
    } catch (error) {
        weatherResult.innerHTML = `<p style="color:red;">${error.message}</p>`;
    }
}

    </script>
</body>
</html>
